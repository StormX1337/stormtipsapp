# Reverse proxy for a host-mode deployment of STORM TIPS.
#
# Use this when the apps run directly on the host (`pnpm dev` or `pnpm start`)
# rather than in the compose stack — `nginx.conf` in this directory is the
# container variant and addresses the services by container name.
#
# Install:
#   sudo cp infra/nginx/tips.stormclient.xyz.conf /etc/nginx/sites-available/tips
#   sudo ln -sf /etc/nginx/sites-available/tips /etc/nginx/sites-enabled/tips
#   sudo nginx -t && sudo systemctl reload nginx
#
# Needs nginx 1.25.1 or newer for the `http2 on;` directive. On anything older,
# delete those lines and write `listen 443 ssl http2;` instead.
#
# The certificate paths below are what certbot writes; see docs/deployment.md
# for the full sequence, including the Cloudflare records.

# ── real client IP behind Cloudflare ─────────────────────────────────────────
#
# With the orange cloud on, every request arrives from a Cloudflare address.
# Without this the API would rate-limit all visitors as one client and write
# Cloudflare's IP into the audit log. Ranges: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Stripe, Apple and Google post webhooks. A retry storm after an outage looks
# exactly like an attack to a rate limiter, and a dropped webhook silently
# loses a subscription — so they get their own, far more generous zone.
limit_req_zone $binary_remote_addr zone=st_api:10m      rate=20r/s;
limit_req_zone $binary_remote_addr zone=st_webhooks:10m rate=50r/s;

upstream st_web   { server 127.0.0.1:3000; keepalive 32; }
upstream st_admin { server 127.0.0.1:3001; keepalive 32; }
upstream st_api   { server 127.0.0.1:4000; keepalive 32; }

# ── HTTP: ACME only, everything else upgraded ────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name tips.stormclient.xyz admin.tips.stormclient.xyz;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── the public site ──────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tips.stormclient.xyz;

    ssl_certificate     /etc/letsencrypt/live/tips.stormclient.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tips.stormclient.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 2m;
    keepalive_timeout 65s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # Matched before the general /api/ rule below, so a webhook never hits the
    # visitor rate limit.
    location /api/v1/webhooks/ {
        limit_req zone=st_webhooks burst=100 nodelay;
        proxy_pass http://st_api;
    }

    # The browser talks to /api on this origin, so there is no CORS to satisfy
    # and no API port to expose publicly.
    location /api/ {
        limit_req zone=st_api burst=40 nodelay;
        proxy_pass http://st_api;
    }

    location /health {
        proxy_pass http://st_api;
        access_log off;
    }

    # Next.js rewrites cannot carry a WebSocket upgrade; nginx can, which is
    # what makes the live screen stream instead of poll.
    location /ws {
        proxy_pass http://st_api;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://st_web;
    }
}

# ── the admin console, on its own hostname ───────────────────────────────────
#
# Separate so it can be firewalled and kept out of search indexes without
# touching the public site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.tips.stormclient.xyz;

    ssl_certificate     /etc/letsencrypt/live/tips.stormclient.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tips.stormclient.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ { proxy_pass http://st_api; }
    location /ws {
        proxy_pass http://st_api;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location /     { proxy_pass http://st_admin; }
}
