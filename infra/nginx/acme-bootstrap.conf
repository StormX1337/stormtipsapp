# HTTP-only bootstrap, used once to obtain the first certificate.
#
# The full config (`tips.stormclient.xyz.conf`) references certificate files, so
# nginx refuses to load it before those exist — and certbot's webroot challenge
# needs a web server already answering on port 80 for the domain. This config
# breaks that circle: it serves nothing but the ACME challenge directory, so it
# loads with no certificate present.
#
#   sudo cp infra/nginx/acme-bootstrap.conf /etc/nginx/sites-available/tips
#   sudo ln -sf /etc/nginx/sites-available/tips /etc/nginx/sites-enabled/tips
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then request the certificate, and replace this file with the full config.
# Renewals do not need it again: the full config keeps serving the same
# challenge directory on port 80.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name tips.stormclient.xyz admin.tips.stormclient.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Nothing else is served yet — say so rather than leaking a default page.
    location / {
        return 503 "STORM TIPS: TLS setup in progress\n";
        default_type "text/plain";
    }
}
