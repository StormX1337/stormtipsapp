# Reverse proxy for the PROFIT TIPS stack.
#
# Terminates TLS, routes the three origins, and forwards the WebSocket upgrade.
# Certificates are mounted at /etc/nginx/certs (see docs/deployment.md).

worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  log_format main '$remote_addr - $status $request_time "$request" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  client_max_body_size 2m;
  keepalive_timeout 65s;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_min_length 1024;

  # Stripe, Apple and Google post webhooks; they must not be rate limited away.
  map $request_uri $is_webhook {
    default 0;
    ~^/api/v1/webhooks/ 1;
  }
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  upstream api   { server api:4000;   keepalive 32; }
  upstream web   { server web:3000;   keepalive 32; }
  upstream admin { server admin:3001; keepalive 32; }

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;

  server {
    listen 80;
    server_name _;

    # ACME challenges stay on HTTP; everything else is redirected.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api;
    }

    location /health { proxy_pass http://api; access_log off; }

    location /ws {
      proxy_pass http://api;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }

    location / {
      proxy_pass http://web;
    }
  }

  # The admin console is served from its own hostname so it can be firewalled
  # and kept out of search indexes independently of the public site.
  server {
    listen 443 ssl;
    http2 on;
    server_name admin.*;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ { proxy_pass http://api; }
    location /     { proxy_pass http://admin; }
  }
}
