# STORM TIPS — full stack.
#
#   docker compose -f infra/docker/docker-compose.yml --env-file .env up -d --build
#
# Every secret comes from the environment; nothing is baked into an image.
name: storm-tips

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${POSTGRES_USER:-storm}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-storm_tips}?schema=public
  DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-storm}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-storm_tips}?schema=public
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN}
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
  WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
  ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-http://localhost:3001}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
  SPORTS_PROVIDER: ${SPORTS_PROVIDER:-mock}
  SPORTS_API_KEY: ${SPORTS_API_KEY:-}
  THEODDSAPI_KEY: ${THEODDSAPI_KEY:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:3000/billing/success}
  STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:3000/billing/cancelled}
  APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-com.stormtips.app}
  APPLE_ISSUER_ID: ${APPLE_ISSUER_ID:-}
  APPLE_KEY_ID: ${APPLE_KEY_ID:-}
  APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
  APPLE_ENVIRONMENT: ${APPLE_ENVIRONMENT:-Sandbox}
  GOOGLE_PLAY_PACKAGE_NAME: ${GOOGLE_PLAY_PACKAGE_NAME:-com.stormtips.app}
  GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64:-}
  EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
  FCM_SERVICE_ACCOUNT_JSON_BASE64: ${FCM_SERVICE_ACCOUNT_JSON_BASE64:-}
  APNS_KEY_ID: ${APNS_KEY_ID:-}
  APNS_TEAM_ID: ${APNS_TEAM_ID:-}
  APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_FROM: ${SMTP_FROM:-STORM TIPS <no-reply@stormtips.app>}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-storm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-storm_tips}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-storm} -d ${POSTGRES_DB:-storm_tips}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published: only the application containers need the database.
    expose:
      - '5432'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - '6379'

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    # Applies pending migrations, then exits. Seeding is deliberately manual.
    command: ['./node_modules/.bin/prisma', 'migrate', 'deploy', '--schema', 'prisma/schema.prisma']
    restart: 'no'

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - '${API_PORT:-4000}:4000'

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    environment: *app-env
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:4000}
        NEXT_PUBLIC_WS_URL: ${WS_PUBLIC_URL:-ws://localhost:4000/ws}
    environment:
      NODE_ENV: production
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:3000'

  admin:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.admin
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:4000}
        NEXT_PUBLIC_WS_URL: ${WS_PUBLIC_URL:-ws://localhost:4000/ws}
    environment:
      NODE_ENV: production
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - '${ADMIN_PORT:-3001}:3001'

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
      - admin
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    ports:
      - '${HTTP_PORT:-8080}:80'
      - '${HTTPS_PORT:-8443}:443'
    profiles: ['proxy']

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '8025:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    profiles: ['dev']

volumes:
  postgres-data:
  redis-data:
