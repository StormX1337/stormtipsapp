name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Test-only values. Real secrets live in the environment, never in the repo.
  DATABASE_URL: postgresql://profit:profit@localhost:5432/profit_tips_test?schema=public
  DIRECT_DATABASE_URL: postgresql://profit:profit@localhost:5432/profit_tips_test?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-000
  JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-00
  ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  INTERNAL_API_TOKEN: ci-internal-token-value
  NODE_ENV: test
  LOG_LEVEL: silent

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: profit
          POSTGRES_PASSWORD: profit
          POSTGRES_DB: profit_tips_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U profit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter @profit-tips/database exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  mobile:
    name: Mobile bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Proves the Expo app still bundles for a device, which typecheck alone
      # does not catch (Metro resolution, native module imports, assets).
      - name: Export Android bundle
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid
          EXPO_PUBLIC_WS_URL: wss://api.example.invalid/ws
        run: pnpm exec expo export --platform android --output-dir .expo-export

  images:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.worker
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.admin
          push: false
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max
