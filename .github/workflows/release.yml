name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        app: [api, worker, web, admin]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    name: Deploy ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    needs: publish
    # The environment holds the deploy credentials and any required approval.
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      # Replace this step with the target platform's deploy command
      # (see docs/deployment.md). It runs migrations first, then rolls the
      # services, because the API refuses to start against an older schema.
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          if [ -z "${DEPLOY_HOST}" ]; then
            echo "::notice::No DEPLOY_HOST configured — see docs/deployment.md for the one-time setup."
            exit 0
          fi
          install -m 600 /dev/null key && printf '%s' "${DEPLOY_KEY}" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd /srv/profit-tips && IMAGE_TAG=${IMAGE_TAG} docker compose -f infra/docker/docker-compose.yml pull && \
             docker compose -f infra/docker/docker-compose.yml up -d --remove-orphans"
          rm -f key
